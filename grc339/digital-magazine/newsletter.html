<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="style.css">
      <link rel="stylesheet" href="https://use.typekit.net/iva3flx.css">
      <title>The Backboard</title>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
   </head>
   <body>
        <div class="newsletter-container">         
            <header>
            <h1>
               <a href="index.html">
               <img src="thebackboard-logo.svg" alt="The Backboard Logo">
               </a>
            </h1>
            <nav>
               <ul>
                  <li><a href="#">Playoffs</a></li>
                  <li><a href="#">Trades</a></li>
                  <li><a href="#">Draft</a></li>
                  <li><a href="#">Shoes</a></li>
                  <li><a href="#">Opinion</a></li>
                  <li><a href="newsletter.html">Newsletter</a></li>

               </ul>
            </nav>
         </header>
         <main class="newsletter">
            <section>
               <h2>Get Court-Side Access</h2>
               <p>The biggest moves, hottest takes, & freshest kicks — straight to your inbox.</p>
               <form>
                  <ul>
                     <li>
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name" placeholder="First / Last Name" />
                     </li>
                     <li>
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="Email Address" />
                     </li>
                     <li>
                        <h2>Only What You Want</h2>
                        <p>Check everything you want covered.</p>
                        <ul>
                           <li>
                              <input type="checkbox" id="playoffs" value="playoffs" />
                              <label for="playoffs">Playoffs: every buzzer beater, every upset.</label>
                           </li>
                           <li>
                              <input type="checkbox" id="trades" value="trades" />
                              <label for="trades">Trades: who's moving and where they're headed.</label>
                           </li>
                           <li>
                              <input type="checkbox" id="draft" value="draft" />
                              <label for="draft">Draft: prospects, predictions, and rankings.</label>
                           </li>
                           <li>
                              <input type="checkbox" id="shoes" value="shoes" />
                              <label for="shoes">Shoes: the latest colorways and collabs.</label>
                           </li>
                           <li>
                              <input type="checkbox" id="opinion" value="opinion" />
                              <label for="opinion">Opinion: hot takes you won't find anywhere else.</label>
                           </li>
                        </ul>
                     </li>
                     <li>
                        <button type="submit">Sub Me In</button>
                     </li>
                  </ul>
               </form>
            </section>
         </main>
         <footer>
            <p>All rights reserved</p>
         </footer>
      </div>
   </body>
</html>
